name: EconomyPlugin
version: '1.0.0'
main: com.arv.economy.EconomyPlugin
api-version: '26.2'
description: Economy with /bal /pay /shop /tpa /tpahere and a cash sidebar
commands:
  bal:
    description: Show your balance (or another player's)
    usage: /bal [player]
    aliases: [balance, money]
  pay:
    description: Pay another player
    usage: /pay <player> <amount>
  give:
    description: Dev only - give money to a player
    usage: /give <username> <money>
  shop:
    description: Open the shop
    usage: /shop
  tpa:
    description: Ask to teleport to a player
    usage: /tpa <player>
  tpahere:
    description: Ask a player to teleport to you
    usage: /tpahere <player>
  tpaccept:
    description: Accept a teleport request
    usage: /tpaccept
  tpdeny:
    description: Deny a teleport request
    usage: /tpdeny
