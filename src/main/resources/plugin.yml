name: EconomyPlugin
version: '1.0.0'
main: com.arv.economy.EconomyPlugin
api-version: '26.2'
description: DerekSMP economy with /bal /pay /shop /sell /tpa /tpahere /rtp /home, admin tools and a cash sidebar
commands:
  bal:
    description: Show your balance (or another player's)
    usage: /bal [player]
    aliases: [balance, money]
  pay:
    description: Pay a player (amounts like 100m work)
    usage: /pay <player> <amount>
  give:
    description: Dev only - give money to a player
    usage: /give <username> <money>
  remove:
    description: Dev only - remove money from a player
    usage: /remove <username> <money>
  shop:
    description: Open the shop
    usage: /shop
  sell:
    description: Sell the item in your hand, or everything sellable with /sell all
    usage: /sell [all]
  tpa:
    description: Ask to teleport to a player
    usage: /tpa <player>
  tpahere:
    description: Ask a player to teleport to you
    usage: /tpahere <player>
  tpaccept:
    description: Accept a teleport request
    usage: /tpaccept
  tpdeny:
    description: Deny a teleport request
    usage: /tpdeny
  kick:
    description: Admin only - kick an online player
    usage: /kick <player> [reason]
  ban:
    description: Admin only - ban a player
    usage: /ban <player> [reason]
  wipe:
    description: Admin only - reset a player's balance and homes
    usage: /wipe <player>
  removeall:
    description: Admin only - clear a player's balance
    usage: /removeall <player>
  rtp:
    description: Teleport to a random safe location inside the world border
    usage: /rtp
  sethome:
    description: Save a home (up to 10)
    usage: /sethome <name>
  home:
    description: Teleport to a saved home (no name lists your homes)
    usage: /home <name>
  delhome:
    description: Delete a saved home
    usage: /delhome <name>
